
name: Monitor BBDC, SAPR e KLBN

on:
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "docs/index.html"
      - ".github/workflows/monitor.yml"
  schedule:
    # Checagem inicial às 10h30; depois, a cada 30 minutos até 17h30.
    - cron: "30 10 * * 1-5"
      timezone: "America/Recife"
    - cron: "0,30 11-17 * * 1-5"
      timezone: "America/Recife"
    # Fotografia final com 30 minutos de margem após o fechamento da B3.
    - cron: "30 18 * * 1-5"
      timezone: "America/Recife"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brapi-market-data-publish
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Consultar preços e enviar alerta
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Atualizar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados BBDC3/BBDC4"
            git pull --rebase origin main
            git push
          fi
